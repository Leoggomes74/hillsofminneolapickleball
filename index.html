<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#123524">
<title>Pickleball Tournaments — Hills of Minneola</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f6f1;--ink:#123524;--green:#2f6b45;--dark:#123524;--gold:#e0a92a;--mint:#dcebd9;--n3:#ccd7c9;--n6:#6d7c6b;--n7:#54644f;--div:rgba(18,53,36,.38);--red:#a2361f;--f:"Archivo",system-ui,sans-serif}
*{box-sizing:border-box}html,body{margin:0;padding:0;background:#0e2a1b}
body{font-family:var(--f);color:var(--ink);-webkit-text-size-adjust:100%}
#app{max-width:430px;margin:0 auto;min-height:100vh;background:var(--bg);border-left:2px solid var(--div);border-right:2px solid var(--div);padding-bottom:96px;position:relative}
button{font-family:var(--f);cursor:pointer}
input,select{font-family:var(--f)}
a{color:var(--green)}a:hover{color:var(--dark)}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
@keyframes livepulse{0%,100%{opacity:1}50%{opacity:.25}}
.hd{position:sticky;top:0;z-index:20;background:var(--dark);color:#fff;border-bottom:4px solid var(--gold);display:flex;align-items:flex-start;gap:10px;padding:12px 16px}
.hd .hdmain{flex:1;min-width:0}
.hd h1{margin:0;font-size:19px;font-weight:800;line-height:1.05;letter-spacing:-.02em;text-transform:uppercase;overflow-wrap:anywhere}
.hd .sub{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);margin-top:6px}
.hd .tools{display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex:none}
.hd .back{border:2px solid rgba(255,255,255,.5);background:transparent;color:#fff;font-size:20px;line-height:1;font-weight:800;width:34px;height:34px;flex:none;padding:0}
.hd .back:hover{background:rgba(255,255,255,.14)}
.livechip{display:flex;align-items:center;gap:6px;border:2px solid var(--gold);padding:4px 7px;flex:none}
.livechip i{width:7px;height:7px;background:var(--gold);animation:livepulse 1.4s infinite}
.livechip span{font-size:10px;font-weight:800;letter-spacing:.12em;color:var(--gold)}
.syncchip{display:flex;align-items:center;gap:6px;border:2px solid rgba(255,255,255,.4);background:transparent;color:#cfe0d2;font-weight:800;font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;padding:5px 7px;min-height:28px}
.syncchip i{width:6px;height:6px;background:#7fd39a;display:block}
.syncchip.off{border-color:#e08a6a;color:#f1c0ad}.syncchip.off i{background:#e08a6a}
.syncchip.wait i{background:var(--gold);animation:livepulse 1.2s infinite}
.lbl{padding:16px 16px 8px;font-size:11px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--n7)}
.lbl.rule{border-top:2px solid var(--div)}
.bar{padding:12px 16px;background:var(--green);color:#fff;display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.bar h2{margin:0;font-size:22px;font-weight:800;text-transform:uppercase;letter-spacing:-.01em}
.bar .meta{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);text-align:right;flex:none}
.snap{padding:10px 16px;background:var(--mint);border-bottom:2px solid var(--div);font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--n7)}
.empty{padding:20px 16px;font-size:14px;line-height:1.5;color:var(--n7)}
.empty.small{font-size:12.5px;border-top:1px solid var(--n3)}
.cta{display:block;width:calc(100% - 32px);margin:16px;padding:16px;background:var(--green);color:#fff;border:0;font-weight:800;font-size:14px;letter-spacing:.1em;text-transform:uppercase;text-align:left;min-height:56px}
.cta:hover{background:#245536}
.tcard{position:relative;border-top:2px solid var(--div)}
.tcard.arch{opacity:.62}
.tmain{display:block;width:100%;text-align:left;background:transparent;border:0;padding:14px 52px 14px 16px;color:var(--ink)}
.tmain:hover{background:#e7f1e5}
.trow{display:flex;align-items:center;gap:8px}
.tname{font-size:17px;font-weight:800;line-height:1.15}
.pill{font-size:9px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;background:var(--gold);color:#3a2a00;padding:3px 6px;flex:none}
.tmeta{font-size:12px;color:var(--n7);margin-top:4px}
.tfoot{display:flex;justify-content:space-between;align-items:center;margin-top:10px;gap:10px}
.tstat{font-size:9.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--n7);border:2px solid var(--n3);padding:3px 7px}
.tstat.on{border-color:var(--green);color:var(--green)}
.tprog{font-size:11px;font-weight:700;color:var(--n7);font-variant-numeric:tabular-nums}
.tmenu{position:absolute;top:12px;right:10px;width:34px;height:34px;border:2px solid var(--n3);background:transparent;font-size:16px;font-weight:800;color:var(--n7);padding:0}
.tmenu:hover{background:#e7f1e5}
.menuwrap{position:fixed;inset:0;z-index:45;background:rgba(18,53,36,.55);display:flex;align-items:flex-end;justify-content:center}
.menusheet{width:100%;max-width:430px;background:var(--bg);border-top:2px solid var(--ink);padding-bottom:env(safe-area-inset-bottom)}
.mi{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--n3);background:transparent;color:var(--ink);font-weight:800;font-size:13px;letter-spacing:.06em;text-transform:uppercase;padding:16px;min-height:52px}
.mi:hover{background:#e7f1e5}
.mi.danger{color:var(--red)}.mi.danger:hover{background:#f6e6e2}
.mi.close{border-bottom:0;color:var(--n7)}
.fsec{padding:14px 16px;border-bottom:1px solid var(--n3)}
.fsec.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fsec label{display:block;font-size:10px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--n7);margin-bottom:6px}
.fsec input[type=text],.fsec input[type=date],.fsec input[type=time],.fsec input[type=number],.fsec select{width:100%;font-size:16px;font-weight:600;padding:11px 12px;border:2px solid var(--n3);background:#fff;color:var(--ink);min-height:46px}
.fsec input:focus,.fsec select:focus{outline:0;border-color:var(--green)}
.fsec.check label{display:flex;align-items:center;gap:10px;font-size:13px;letter-spacing:.04em;text-transform:none;color:var(--ink);font-weight:700;margin:0}
.fsec.check input{width:22px;height:22px;accent-color:var(--green)}
.fnote{padding:10px 16px;font-size:12.5px;line-height:1.45;color:var(--n7);background:var(--mint)}
.fnote.top{border-bottom:1px solid var(--n3)}
.fsec .fnote{margin:10px -16px -14px;padding:10px 16px}
.ferr{margin:12px 16px 0;padding:11px 13px;background:#f6e6e2;border-left:5px solid var(--red);font-size:13px;font-weight:600;color:var(--red)}
.facts{display:grid;grid-template-columns:1fr 1.4fr;gap:2px;background:var(--ink);margin-top:16px}
.fbtn{border:0;background:var(--green);color:#fff;font-weight:800;font-size:13px;letter-spacing:.08em;text-transform:uppercase;padding:17px 14px;min-height:56px}
.fbtn:hover{background:#245536}
.fbtn.ghost{background:var(--bg);color:var(--ink)}.fbtn.ghost:hover{background:#e7f1e5}
.fbtn.wide{display:block;width:calc(100% - 32px);margin:14px 16px 0}
.trow2{display:grid;grid-template-columns:26px 1fr;gap:10px;padding:12px 16px;border-bottom:1px solid var(--n3);align-items:start}
.tnum{font-weight:800;font-size:14px;color:var(--n7);padding-top:12px;font-variant-numeric:tabular-nums}
.tfields{display:grid;gap:8px}
.tfields input{width:100%;font-size:15px;font-weight:600;padding:10px 11px;border:2px solid var(--n3);background:#fff;color:var(--ink);min-height:44px}
.tfields input:focus{outline:0;border-color:var(--green)}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pgrid.one{grid-template-columns:1fr}
.pools{display:flex;gap:6px;flex-wrap:wrap}
.pbtn{width:38px;height:38px;border:2px solid var(--n3);background:#fff;font-weight:800;font-size:13px;color:var(--n7);padding:0}
.pbtn.on{background:var(--green);border-color:var(--green);color:#fff}
.live{margin:0 16px 12px;background:var(--green);color:#fff}
.live .top{display:flex;justify-content:space-between;gap:10px;padding:8px 12px;border-bottom:2px solid rgba(255,255,255,.35);font-size:10.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase}
.live .row{display:grid;grid-template-columns:1fr auto;align-items:center;gap:8px;padding:12px}
.live .row+.row{border-top:2px solid rgba(255,255,255,.35)}
.live .tm{font-weight:800;font-size:17px;line-height:1.1}
.live .sc{font-weight:800;font-size:40px;line-height:.9;font-variant-numeric:tabular-nums;color:var(--gold)}
.live .act{width:100%;border:0;border-top:2px solid rgba(255,255,255,.35);background:transparent;color:#fff;font-weight:800;font-size:13px;letter-spacing:.1em;text-transform:uppercase;text-align:left;padding:13px 12px;min-height:48px}
.live .act:hover{background:rgba(0,0,0,.14)}
.note{padding:16px;border-bottom:2px solid var(--div)}
.note .k{font-size:11px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--n7)}
.note p{margin:6px 0 0;font-size:14px;line-height:1.5}
.next{display:grid;grid-template-columns:64px 1fr;gap:12px;width:100%;text-align:left;background:transparent;border:0;border-top:2px solid var(--div);padding:12px 16px;color:var(--ink);min-height:56px}
.next:hover{background:#e7f1e5}
.next .no{font-weight:800;font-size:17px}
.next .cd{font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--n7);margin-top:2px}
.next .t{font-weight:600;font-size:14px;line-height:1.3}
.next .v{font-size:11px;color:var(--n6);margin:2px 0}
.res{display:grid;grid-template-columns:1fr auto;gap:12px;border-top:2px solid var(--div);padding:12px 16px}
.res .k{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--n7);margin-bottom:3px}
.res .t{font-weight:600;font-size:14px}
.res .s{text-align:right;font-weight:800;font-size:18px;font-variant-numeric:tabular-nums;line-height:1.35}
.sthead,.strow{display:grid;grid-template-columns:22px 1fr 34px 34px 40px;gap:8px;padding:6px 16px}
.sthead{border-bottom:2px solid var(--ink);font-size:10px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--n7)}
.sthead .r,.strow .r{text-align:right}
.strow{align-items:center;padding:12px 16px;border-bottom:1px solid var(--n3);font-variant-numeric:tabular-nums}
.strow .p{font-weight:800;font-size:14px}
.strow .t{font-weight:600;font-size:14px;line-height:1.2}
.strow .w{text-align:right;font-weight:800;font-size:14px}
.strow .l{text-align:right;font-size:14px;color:var(--n7)}
.strow .d{text-align:right;font-size:14px}
.strow.adv{background:var(--mint)}
.mrow{display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:center;width:100%;text-align:left;background:transparent;border:0;border-top:1px solid var(--n3);padding:12px 16px;color:var(--ink);min-height:52px}
.mrow:hover{background:#e7f1e5}
.mrow .n{font-size:12px;font-weight:700;color:var(--n7)}
.mrow .t{font-size:13px;line-height:1.35;font-weight:600}
.mrow .s{text-align:right;font-weight:800;font-size:15px;font-variant-numeric:tabular-nums}
.mrow .s.on{color:var(--green)}
.sf{margin:0 16px 12px;border:2px solid var(--ink);color:var(--ink);background:#fff;width:calc(100% - 32px);text-align:left;display:block;padding:0;font-family:var(--f)}
.sf .h{background:var(--mint);font-size:10px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;padding:7px 12px;border-bottom:2px solid var(--ink)}
.sf .s{padding:12px;display:grid;grid-template-columns:1fr auto;align-items:center;gap:12px}
.sf .s+.s{border-top:1px solid var(--n3)}
.sf .s.w{background:var(--mint)}
.sf .seed{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--n7)}
.sf .tm{font-weight:800;font-size:16px;margin-top:2px}
.sf .num{font-weight:800;font-size:24px;font-variant-numeric:tabular-nums;line-height:1}
.sf .glist{display:flex;gap:12px;padding:8px 12px;border-top:1px solid var(--n3);font-size:11px;font-weight:800;letter-spacing:.06em;color:var(--n7);font-variant-numeric:tabular-nums}
.sf.fin{background:var(--dark);color:#fff;border-color:var(--gold)}
.sf.fin .h{background:rgba(255,255,255,.08);color:var(--gold);border-bottom-color:rgba(255,255,255,.3)}
.sf.fin .s+.s{border-top-color:rgba(255,255,255,.2)}
.sf.fin .s.w{background:rgba(224,169,42,.16)}
.sf.fin .seed{color:var(--gold)}
.sf.fin .num{color:var(--gold)}
.sf.fin .glist{color:#cfe0d2;border-top-color:rgba(255,255,255,.2)}
.award{margin:0 16px 12px;padding:11px 13px;background:var(--mint);border-left:5px solid var(--green);font-size:12.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase}
.award.gold{background:var(--dark);color:#fff;border-left-color:var(--gold)}
.team{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;border-top:1px solid var(--n3);padding:12px 16px}
.team .n{font-weight:800;font-size:15px}
.team .p{font-size:12px;color:var(--n7);margin-top:2px}
.team .r{font-size:11px;font-weight:800;letter-spacing:.08em;color:var(--n7);font-variant-numeric:tabular-nums}
.sec{padding:16px;border-bottom:2px solid var(--div)}
.sec h3{margin:0 0 8px;font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--n7)}
.sec h3.acc{color:#8a5a00}
.sec p{margin:0;font-size:14px;line-height:1.55;text-wrap:pretty}
.podium{margin:0 16px 12px;background:var(--dark);color:#fff;border:3px solid var(--gold)}
.podium .top{padding:14px 16px;border-bottom:2px solid rgba(255,255,255,.25);text-align:center}
.podium .lbl{font-size:10px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);padding:0}
.podium .nm{font-size:26px;font-weight:800;line-height:1.05;margin-top:5px}
.podium .pl{font-size:12.5px;color:#cfe0d2;margin-top:4px}
.podium .row{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding:11px 16px;border-top:1px solid rgba(255,255,255,.18)}
.podium .row .p{font-size:10px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
.podium .row .t{font-size:15px;font-weight:800;margin-top:2px}
.podium .row b{font-size:11px;font-weight:800;letter-spacing:.08em;color:#cfe0d2}
.kpi{display:grid;grid-template-columns:1fr 1fr;gap:2px;background:var(--n3);margin:0 16px}
.kpi div{background:var(--mint);padding:12px 14px}
.kpi b{display:block;font-size:24px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.kpi span{display:block;font-size:9px;font-weight:800;letter-spacing:.11em;text-transform:uppercase;color:var(--n7);margin-top:6px}
.hl{display:grid;grid-template-columns:88px 1fr;gap:12px;padding:11px 16px;border-top:1px solid var(--n3);font-size:13px;line-height:1.4}
.hl b{font-size:9px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--green);padding-top:3px}
.hl.thanks{grid-template-columns:1fr;border-top:2px solid var(--ink);padding:16px}
.mini{display:grid;grid-template-columns:20px 1fr 44px 44px;gap:8px;align-items:center;padding:9px 16px;border-top:1px solid var(--n3);font-size:13px;font-variant-numeric:tabular-nums}
.mini.h{border-top:2px solid var(--ink);font-size:9px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--n7)}
.mini .t{font-weight:600}
.mini .r{text-align:right}
.mini.adv{background:var(--mint);font-weight:800}
.ktile{margin:0 16px 10px;border:2px solid var(--ink);background:#fff}
.ktile .h2{background:var(--ink);color:var(--gold);font-size:9px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;padding:6px 12px}
.ktile .l{display:grid;grid-template-columns:1fr auto;gap:10px;padding:9px 12px;font-size:13px}
.ktile .l+.l{border-top:1px solid var(--n3)}
.ktile .l.w{background:var(--mint);font-weight:800}
.ktile .l b{font-variant-numeric:tabular-nums}
.nav{position:fixed;bottom:0;left:0;right:0;z-index:30;display:flex;justify-content:center}
.nav>div{width:100%;max-width:430px;display:grid;background:var(--bg);border-top:2px solid var(--ink);padding-bottom:env(safe-area-inset-bottom)}
.nav button{position:relative;border:0;background:transparent;padding:14px 1px 16px;font-weight:800;font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink);min-height:56px}
.nav button.on::before{content:"";position:absolute;top:0;left:0;right:0;height:4px;background:var(--gold)}
.back2{position:fixed;inset:0;z-index:50;background:rgba(18,53,36,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:430px;background:var(--bg);border-top:2px solid var(--ink);padding-bottom:env(safe-area-inset-bottom);max-height:92vh;overflow:auto}
.sheet .h{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 16px;border-bottom:2px solid var(--ink);position:sticky;top:0;background:var(--bg)}
.sheet .h b{font-size:12.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase}
.sheet .h button{border:2px solid var(--ink);background:transparent;font-weight:800;font-size:12px;padding:6px 10px;color:var(--ink);flex:none}
.sheet .h button:hover{background:#e7f1e5}
.sheet .msg{padding:16px;border-bottom:1px solid var(--n3);font-size:14px;line-height:1.5}
.glabel{padding:10px 16px 0;font-size:10px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--green)}
.sheet .r{display:grid;grid-template-columns:1fr 132px;gap:12px;align-items:center;padding:12px 16px}
.sheet .r .tm{font-weight:800;font-size:16px;line-height:1.15}
.step{display:grid;grid-template-columns:34px minmax(52px,1fr) 34px;align-items:center;gap:6px}
.step button{height:44px;border:2px solid var(--ink);font-size:20px;font-weight:800}
.step .minus{background:transparent;color:var(--ink)}.step .minus:hover{background:#e7f1e5}
.step .plus{background:var(--ink);color:#fff}.step .plus:hover{background:var(--green)}
.step .v{text-align:center;font-weight:800;font-size:30px;font-variant-numeric:tabular-nums;width:100%;min-width:0;border:0;border-bottom:2px solid var(--n3);background:transparent;color:var(--ink);font-family:var(--f);padding:2px 0;-moz-appearance:textfield}
.step .v::-webkit-outer-spin-button,.step .v::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.step .v:focus{outline:0;border-bottom-color:var(--gold)}
.rm{display:block;width:100%;text-align:left;border:0;border-top:2px solid var(--ink);background:transparent;color:var(--red);font-weight:800;font-size:12px;letter-spacing:.08em;text-transform:uppercase;padding:14px 16px;min-height:48px}
.rm:hover{background:#f6e6e2}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:2px;border-top:2px solid var(--ink);background:var(--ink)}
.acts button{border:0;font-weight:800;font-size:13px;letter-spacing:.08em;text-transform:uppercase;text-align:left;padding:16px;min-height:52px}
.acts .lv{background:var(--bg);color:var(--ink)}.acts .lv:hover{background:#e7f1e5}
.acts .fn{background:var(--green);color:#fff}.acts .fn:hover{background:#245536}
.acts .fn.danger{background:var(--red)}.acts .fn.danger:hover{background:#7f2917}
.gate .msg{padding:16px;border-bottom:1px solid var(--n3)}
.dots{display:flex;gap:10px;padding:16px 16px}
.dots i{width:16px;height:16px;border:2px solid var(--ink);display:block}
.dots i.on{background:var(--ink)}
.dots i.bad{border-color:var(--red);background:var(--red)}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;background:var(--ink);border-top:2px solid var(--ink)}
.keys button{border:0;background:var(--bg);color:var(--ink);font-weight:800;font-size:20px;padding:16px 0;min-height:58px}
.keys button:hover{background:#e7f1e5}
