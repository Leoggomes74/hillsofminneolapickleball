<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#123524">
<title>Hills of Minneola Mixed Doubles — Summer 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f6f1;--ink:#123524;--green:#2f6b45;--dark:#123524;--gold:#e0a92a;--mint:#dcebd9;--n3:#ccd7c9;--n6:#6d7c6b;--n7:#54644f;--div:rgba(18,53,36,.38);--f:"Archivo",system-ui,sans-serif}
*{box-sizing:border-box}html,body{margin:0;padding:0;background:#0e2a1b}
body{font-family:var(--f);color:var(--ink);-webkit-text-size-adjust:100%}
#app{max-width:430px;margin:0 auto;min-height:100vh;background:var(--bg);border-left:2px solid var(--div);border-right:2px solid var(--div);padding-bottom:96px}
button{font-family:var(--f);cursor:pointer}
a{color:var(--green)}a:hover{color:var(--dark)}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
@keyframes livepulse{0%,100%{opacity:1}50%{opacity:.25}}
.hd{position:sticky;top:0;z-index:20;background:var(--dark);color:#fff;border-bottom:4px solid var(--gold);display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:12px 16px}
.hd h1{margin:0;font-size:19px;font-weight:800;line-height:1.05;letter-spacing:-.02em;text-transform:uppercase}
.hd .sub{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);margin-top:6px}
.livechip{display:flex;align-items:center;gap:6px;border:2px solid var(--gold);padding:4px 7px;flex:none}
.livechip i{width:7px;height:7px;background:var(--gold);animation:livepulse 1.4s infinite}
.livechip span{font-size:10px;font-weight:800;letter-spacing:.12em;color:var(--gold)}
.lbl{padding:16px 16px 8px;font-size:11px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--n7)}
.lbl.rule{border-top:2px solid var(--div)}
.bar{padding:12px 16px;background:var(--green);color:#fff;display:flex;justify-content:space-between;align-items:baseline}
.bar h2{margin:0;font-size:22px;font-weight:800;text-transform:uppercase;letter-spacing:-.01em}
.bar .meta{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold)}
.live{margin:0 16px 12px;background:var(--green);color:#fff}
.live .top{display:flex;justify-content:space-between;padding:8px 12px;border-bottom:2px solid rgba(255,255,255,.35);font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase}
.live .row{display:grid;grid-template-columns:1fr auto;align-items:center;gap:8px;padding:12px}
.live .row+.row{border-top:2px solid rgba(255,255,255,.35)}
.live .tm{font-weight:800;font-size:17px;line-height:1.1}
.live .sc{font-weight:800;font-size:40px;line-height:.9;font-variant-numeric:tabular-nums;color:var(--gold)}
.live .act{width:100%;border:0;border-top:2px solid rgba(255,255,255,.35);background:transparent;color:#fff;font-weight:800;font-size:13px;letter-spacing:.1em;text-transform:uppercase;text-align:left;padding:13px 12px;min-height:48px}
.live .act:hover{background:rgba(0,0,0,.14)}
.next{display:grid;grid-template-columns:58px 1fr;gap:12px;width:100%;text-align:left;background:transparent;border:0;border-top:2px solid var(--div);padding:12px 16px;color:var(--ink);min-height:56px}
.next:hover{background:#e7f1e5}
.next .no{font-weight:800;font-size:17px}.next .cd{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--n7)}
.next .t{font-weight:600;font-size:14px;line-height:1.3}.next .v{font-size:11px;color:var(--n6);margin:2px 0}
.res{display:grid;grid-template-columns:1fr auto;gap:12px;border-top:2px solid var(--div);padding:12px 16px}
.res .k{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--n7);margin-bottom:3px}
.res .t{font-weight:600;font-size:14px}
.res .s{text-align:right;font-weight:800;font-size:18px;font-variant-numeric:tabular-nums;line-height:1.35}
.sthead,.strow{display:grid;grid-template-columns:22px 1fr 34px 34px 40px;gap:8px;padding:6px 16px}
.sthead{border-bottom:2px solid var(--ink);font-size:10px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--n7)}
.strow{align-items:center;padding:12px 16px;border-bottom:1px solid var(--n3);font-variant-numeric:tabular-nums}
.strow .p{font-weight:800;font-size:14px}.strow .t{font-weight:600;font-size:14px;line-height:1.2}
.strow .w{text-align:right;font-weight:800;font-size:14px}.strow .l{text-align:right;font-size:14px;color:var(--n7)}.strow .d{text-align:right;font-size:14px}
.strow.adv{background:var(--mint)}
.mrow{display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:center;width:100%;text-align:left;background:transparent;border:0;border-top:1px solid var(--n3);padding:12px 16px;color:var(--ink);min-height:52px}
.mrow:hover{background:#e7f1e5}
.mrow .n{font-size:12px;font-weight:700;color:var(--n7)}
.mrow .t{font-size:13px;line-height:1.35;font-weight:600}
.mrow .s{text-align:right;font-weight:800;font-size:15px;font-variant-numeric:tabular-nums;line-height:1.35}
.mrow .s.on{color:var(--green)}
.sf{margin:0 16px 12px;border:2px solid var(--ink);color:var(--ink);background:var(--bg);width:calc(100% - 32px);text-align:left;display:block;padding:0;font-family:var(--f)}
.sf .h{padding:6px 12px;border-bottom:2px solid var(--ink);font-size:10px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;background:var(--mint)}
.sf .s{padding:12px;display:grid;grid-template-columns:1fr auto;align-items:center;gap:12px}.sf .s+.s{border-top:1px solid var(--n3)}
.sf .tm{font-weight:800;font-size:16px;margin-top:2px;color:var(--ink)}
.sf .seed{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--n7)}
.sf .num,.fin .num{font-weight:800;font-size:24px;font-variant-numeric:tabular-nums;line-height:1}
.sf .seed{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--n7)}
.sf .tm{font-weight:800;font-size:16px;margin-top:2px}
.fin{margin:0 16px 16px;background:var(--dark);color:#fff;border:2px solid var(--gold);width:calc(100% - 32px);text-align:left;display:block;padding:0;font-family:var(--f)}
.fin .s{padding:12px;display:grid;grid-template-columns:1fr auto;align-items:center;gap:12px}.fin .s+.s{border-top:2px solid rgba(255,255,255,.3)}
.fin .num{color:var(--gold)}
.fin .seed{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold)}
.fin .tm{font-weight:800;font-size:20px;margin-top:2px}
.team{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;border-top:1px solid var(--n3);padding:12px 16px}
.team .n{font-weight:800;font-size:15px}.team .p{font-size:12px;color:var(--n7);margin-top:2px}
.team .r{font-size:11px;font-weight:800;letter-spacing:.08em;color:var(--n7);font-variant-numeric:tabular-nums}
.sec{padding:16px;border-bottom:2px solid var(--div)}
.sec h3{margin:0 0 8px;font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--n7)}
.sec h3.acc{color:#8a5a00}
.sec p{margin:0;font-size:14px;line-height:1.55;text-wrap:pretty}.sec p+p{margin-top:12px}
.note{padding:16px;border-bottom:2px solid var(--div)}
.note p{margin:6px 0 0;font-size:14px;line-height:1.5}
.nav{position:fixed;bottom:0;left:0;right:0;z-index:30;display:flex;justify-content:center}
.nav>div{width:100%;max-width:430px;display:grid;grid-template-columns:repeat(6,1fr);background:var(--bg);border-top:2px solid var(--ink);padding-bottom:env(safe-area-inset-bottom)}
.nav button{position:relative;border:0;background:transparent;padding:14px 1px 16px;font-weight:800;font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink);min-height:56px}
.nav button.on::before{content:"";position:absolute;top:0;left:0;right:0;height:4px;background:var(--gold)}
.back{position:fixed;inset:0;z-index:40;background:rgba(18,53,36,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:430px;background:var(--bg);border-top:2px solid var(--ink);padding-bottom:env(safe-area-inset-bottom)}
.sheet .h{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:2px solid var(--ink)}
.sheet .h b{font-size:14px;font-weight:800;letter-spacing:.06em;text-transform:uppercase}
.sheet .h button{border:2px solid var(--ink);background:transparent;font-weight:800;font-size:12px;padding:6px 10px;color:var(--ink)}
.sheet .h button:hover{background:#e7f1e5}
.sheet .r{display:grid;grid-template-columns:1fr 132px;gap:12px;align-items:center;padding:16px}
.sheet .r+.r{border-top:1px solid var(--n3)}
.sheet .r .tm{font-weight:800;font-size:17px;line-height:1.15}
.step{display:grid;grid-template-columns:34px minmax(52px,1fr) 34px;align-items:center;gap:6px}
.step button{height:44px;border:2px solid var(--ink);font-size:20px;font-weight:800}
.step .minus{background:transparent;color:var(--ink)}.step .minus:hover{background:#e7f1e5}
.step .plus{background:var(--ink);color:#fff}.step .plus:hover{background:var(--green)}
.step .v{text-align:center;font-weight:800;font-size:30px;font-variant-numeric:tabular-nums;width:100%;min-width:0;border:0;border-bottom:2px solid var(--n3);background:transparent;color:var(--ink);font-family:var(--f);padding:2px 0;-moz-appearance:textfield}
.step .v::-webkit-outer-spin-button,.step .v::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.step .v:focus{outline:0;border-bottom-color:var(--gold)}
.rm{display:block;width:100%;text-align:left;border:0;border-top:2px solid var(--ink);background:transparent;color:#a2361f;font-weight:800;font-size:12px;letter-spacing:.08em;text-transform:uppercase;padding:14px 16px;min-height:48px}
.rm:hover{background:#f6e6e2}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:2px;border-top:2px solid var(--ink);background:var(--ink)}
.acts button{border:0;font-weight:800;font-size:13px;letter-spacing:.08em;text-transform:uppercase;text-align:left;padding:16px;min-height:52px}
.acts .lv{background:var(--bg);color:var(--ink)}.acts .lv:hover{background:#e7f1e5}
.acts .fn{background:var(--green);color:#fff}.acts .fn:hover{background:#245536}
.pad{height:24px}
.podium{margin:0 16px 12px;background:var(--dark);color:#fff;border:3px solid var(--gold)}
.podium .top{padding:14px 16px;border-bottom:2px solid rgba(255,255,255,.25);text-align:center}
.podium .lbl{font-size:10px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;color:var(--gold)}
.podium .nm{font-size:26px;font-weight:800;line-height:1.05;margin-top:5px}
.podium .pl{font-size:12.5px;color:#cfe0d2;margin-top:4px}
.podium .row{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding:11px 16px;border-top:1px solid rgba(255,255,255,.18)}
.podium .row .p{font-size:10px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
.podium .row .t{font-size:15px;font-weight:800;margin-top:2px}
.podium .row b{font-size:11px;font-weight:800;letter-spacing:.08em;color:#cfe0d2;font-variant-numeric:tabular-nums}
.kpi{display:grid;grid-template-columns:1fr 1fr;gap:2px;background:var(--n3);margin:0 16px}
.kpi div{background:var(--mint);padding:12px 14px}
.kpi b{display:block;font-size:24px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.kpi span{display:block;font-size:9px;font-weight:800;letter-spacing:.11em;text-transform:uppercase;color:var(--n7);margin-top:6px}
.hl{display:grid;grid-template-columns:88px 1fr;gap:12px;padding:11px 16px;border-top:1px solid var(--n3);font-size:13px;line-height:1.4}
.hl b{font-size:9px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--green);padding-top:3px}
.mini{display:grid;grid-template-columns:20px 1fr 40px 44px;gap:8px;align-items:center;padding:9px 16px;border-top:1px solid var(--n3);font-size:13px;font-variant-numeric:tabular-nums}
.mini.h{border-top:2px solid var(--ink);font-size:9px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--n7)}
.mini .t{font-weight:600}
.mini.adv{background:var(--mint);font-weight:800}
.mini .r{text-align:right}
.ktile{margin:0 16px 10px;border:2px solid var(--ink);background:#fff}
.ktile .h2{background:var(--ink);color:var(--gold);font-size:9px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;padding:6px 12px}
.ktile .l{display:grid;grid-template-columns:1fr auto;gap:10px;padding:9px 12px;font-size:13px}
.ktile .l+.l{border-top:1px solid var(--n3)}
.ktile .l.w{background:var(--mint);font-weight:800}
.ktile .l b{font-variant-numeric:tabular-nums}
.empty{padding:20px 16px;font-size:14px;line-height:1.5;color:var(--n7)}
.hd .tools{display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex:none}
.syncchip{display:flex;align-items:center;gap:6px;border:2px solid rgba(255,255,255,.4);background:transparent;color:#cfe0d2;font-weight:800;font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;padding:5px 7px;min-height:28px}
.syncchip i{width:6px;height:6px;background:#7fd39a;display:block}
.syncchip.off{border-color:#e08a6a;color:#f1c0ad}
.syncchip.off i{background:#e08a6a}
.syncchip.wait i{background:var(--gold);animation:livepulse 1.2s infinite}
.toast{position:fixed;left:0;right:0;bottom:76px;z-index:50;display:flex;justify-content:center;pointer-events:none}
.toast span{background:var(--dark);color:#fff;font-weight:800;font-size:12px;letter-spacing:.06em;text-transform:uppercase;padding:10px 16px;border:2px solid var(--gold)}
.gate .msg{padding:16px;border-bottom:1px solid var(--n3);font-size:14px;line-height:1.5}
.dots{display:flex;gap:10px;padding:0 16px 16px}
.dots i{width:16px;height:16px;border:2px solid var(--ink);display:block}
.dots i.on{background:var(--ink)}
.dots i.bad{border-color:#a2361f;background:#a2361f}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;background:var(--ink);border-top:2px solid var(--ink)}
.keys button{border:0;background:var(--bg);color:var(--ink);font-weight:800;font-size:20px;padding:16px 0;min-height:58px}
.keys button:hover{background:#e7f1e5}
.keys button.wide{grid-column:span 1;font-size:12px;letter-spacing:.08em;text-transform:uppercase}
</style>
</head>
<body>
<div id="app"></div>
<script>
var TEAMS=[["A","Arepa con Pitorro","Jaime Morales & Georgina"],["A","Caribe Smash","Rafael & Jean"],["A","Dinking Couple","Mat & Colby"],["A","Team Lionic","Nicci & Gene"],["A","The Strangers","Sabrina & Daniel"],["B","V Power","Sandra & Carlos"],["B","Team Flame","Berta & William"],["B","Team Venom","Raghu & Gabby"],["B","Macho Camacho","Crystal & Marcus"],["B","R&B","Rola & Balbino"]].map(function(r){return{pool:r[0],name:r[1],players:r[2]}});
var SCHEDULE=[[1,"A","GA1","Arepa con Pitorro","Caribe Smash"],[2,"B","GB1","V Power","Team Flame"],[3,"A","GA2","Dinking Couple","Team Lionic"],[4,"B","GB2","Team Venom","Macho Camacho"],[5,"A","GA3","Arepa con Pitorro","The Strangers"],[6,"B","GB3","V Power","R&B"],[7,"A","GA4","Caribe Smash","Dinking Couple"],[8,"B","GB4","Team Flame","Team Venom"],[9,"A","GA5","Team Lionic","The Strangers"],[10,"B","GB5","Macho Camacho","R&B"],[11,"A","GA6","Arepa con Pitorro","Dinking Couple"],[12,"B","GB6","V Power","Team Venom"],[13,"A","GA7","Caribe Smash","Team Lionic"],[14,"B","GB7","Team Flame","Macho Camacho"],[15,"A","GA8","Dinking Couple","The Strangers"],[16,"B","GB8","Team Venom","R&B"],[17,"A","GA9","Arepa con Pitorro","Team Lionic"],[18,"B","GB9","V Power","Macho Camacho"],[19,"A","GA10","Caribe Smash","The Strangers"],[20,"B","GB10","Team Flame","R&B"]];
var KEY="hom2026.results";
var TKEY="hom2026.updated";
var PASSCODE="2074";
// ---- Shared live scores via /api/results (Vercel KV) ----------------------
// Nothing to configure here — the API route talks to your Vercel store.
// Works offline too: scores fall back to this device's storage.
var API="/api/results";
var CLOUD=location.protocol!=="file:";
// --------------------------------------------------------------------------
var S={tab:"now",editing:null,dA:0,dB:0,results:{},gate:null,pin:"",bad:false,unlocked:false,t:0,toast:"",sync:CLOUD?"loading":"local"};
try{S.unlocked=sessionStorage.getItem("hom2026.unlocked")==="1"}catch(e){}
try{S.pinUsed=sessionStorage.getItem("hom2026.pin")||""}catch(e){S.pinUsed=""}
try{S.results=JSON.parse(localStorage.getItem(KEY)||"{}")}catch(e){S.results={}}
try{S.t=parseInt(localStorage.getItem(TKEY)||"0",10)||0}catch(e){}
function persist(){S.t=Date.now();try{localStorage.setItem(KEY,JSON.stringify(S.results));localStorage.setItem(TKEY,String(S.t))}catch(e){}}
function sbHeaders(){return{"Content-Type":"application/json"}}
function cloudLoad(quiet){
  if(!CLOUD)return Promise.resolve(false);
  return fetch(API,{cache:"no-store"})
    .then(function(r){if(!r.ok)throw new Error(r.status);return r.json()})
    .then(function(d){
      var map=d&&d.results?d.results:{};
      S.results=map;S.t=d&&d.t?d.t:S.t;S.sync="live";
      try{localStorage.setItem(KEY,JSON.stringify(map));localStorage.setItem(TKEY,String(S.t))}catch(e){}
      render();return true;
    })
    .catch(function(){S.sync="offline";if(!quiet)render();return false});
}
function cloudSave(id,rec){
  if(!CLOUD)return;
  fetch(API,{method:"POST",headers:sbHeaders(),body:JSON.stringify({id:id,a:rec.a,b:rec.b,status:rec.status,pin:S.pinUsed||""})})
    .then(function(r){if(!r.ok)throw new Error(r.status);return r.json()})
    .then(function(d){if(d&&d.results){S.results=d.results;S.t=d.t||Date.now();try{localStorage.setItem(KEY,JSON.stringify(S.results))}catch(e){}}S.sync="live";render()})
    .catch(function(){S.sync="offline";S.toast="Saved on this device only";render();setTimeout(function(){S.toast="";render()},2200)});
}
function cloudDelete(id){
  if(!CLOUD)return;
  fetch(API,{method:"POST",headers:sbHeaders(),body:JSON.stringify({id:id,remove:true,pin:S.pinUsed||""})})
    .then(function(r){if(!r.ok)throw new Error(r.status);return r.json()})
    .then(function(d){if(d&&d.results){S.results=d.results;try{localStorage.setItem(KEY,JSON.stringify(S.results))}catch(e){}}S.sync="live";render()})
    .catch(function(){S.sync="offline";render()});
}
function stamp(t){if(!t)return"";var d=new Date(t);return d.toLocaleString([], {month:"short",day:"numeric",hour:"numeric",minute:"2-digit"})}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
function games(){return SCHEDULE.map(function(r){var o=S.results[r[2]];return{id:r[2],no:r[0],code:r[2],pool:r[1],stage:"Match "+r[0]+" of 20 · Group "+r[1],teamA:r[3],teamB:r[4],scoreA:o?o.a:0,scoreB:o?o.b:0,status:o?o.status:"upcoming",ready:true}})}
function knockout(pools){
  var settled=pools.map(function(p){return p.games.every(function(g){return g.status==="done"})});
  var pick=function(i,j){return settled[i]?pools[i].rows[j].team:null};
  function mk(id,no,code,stage,note,a,b,sa,sb){var o=S.results[id];
    return{id:id,no:no,code:code,stage:stage,note:note,seedA:sa,seedB:sb,teamA:a||"To be decided",teamB:b||"To be decided",ready:!!(a&&b),
      scoreA:o?o.a:0,scoreB:o?o.b:0,status:o?o.status:"upcoming"}}
  var sf1=mk("SF1",21,"SF1","Semifinal 1","11 pts, win by 2",pick(0,0),pick(1,1),"Group A · 1st","Group B · 2nd");
  var sf2=mk("SF2",22,"SF2","Semifinal 2","11 pts, win by 2",pick(1,0),pick(0,1),"Group B · 1st","Group A · 2nd");
  var win=function(m){return m.status==="done"?(m.scoreA>=m.scoreB?m.teamA:m.teamB):null};
  var lose=function(m){return m.status==="done"?(m.scoreA>=m.scoreB?m.teamB:m.teamA):null};
  var fa=win(sf1),fb=win(sf2);
  var ba=lose(sf1),bb=lose(sf2);
  var bronze=mk("B3",23,"3RD","Third place","11 pts, win by 2",ba,bb,"Loser SF1","Loser SF2");
  var g1=mk("F1",24,"F1","Final · Game 1","11 pts, win by 2",fa,fb,"Winner SF1","Winner SF2");
  var g2=mk("F2",25,"F2","Final · Game 2","11 pts, win by 2",fa,fb,"Winner SF1","Winner SF2");

function standings(gs,pool){
  var rows=TEAMS.filter(function(t){return t.pool===pool}).map(function(t){return{team:t.name,w:0,l:0,pf:0,pa:0}});
  var find=function(n){return rows.filter(function(r){return r.team===n})[0]};
  gs.filter(function(g){return g.pool===pool&&g.status==="done"}).forEach(function(g){
    var A=find(g.teamA),B=find(g.teamB);A.pf+=g.scoreA;A.pa+=g.scoreB;B.pf+=g.scoreB;B.pa+=g.scoreA;
    if(g.scoreA>=g.scoreB){A.w++;B.l++}else{B.w++;A.l++}});
  rows.forEach(function(r){r.d=r.pf-r.pa});
  rows.sort(function(x,y){return y.w-x.w||y.d-x.d||y.pf-x.pf});
  return rows.map(function(r,i){return{pos:i+1,team:r.team,w:r.w,l:r.l,diff:(r.d>0?"+":"")+r.d}});
}

    return render()}
  if(t.hasAttribute("data-step")){var v=t.getAttribute("data-step"),k=v[0]==="A"?"dA":"dB",d=parseInt(v.slice(1),10);S[k]=Math.max(0,Math.min(30,S[k]+d));return render()}
  if(t.hasAttribute("data-save")){var rec={a:S.dA,b:S.dB,status:t.getAttribute("data-save")};S.results[S.editing]=rec;persist();cloudSave(S.editing,rec);S.editing=null;return render()}
  if(t.hasAttribute("data-clear")){var cid=S.editing;delete S.results[cid];persist();cloudDelete(cid);S.editing=null;return render()}
  if(t.hasAttribute("data-refresh")){S.sync="loading";render();cloudLoad();return}
  if(t.hasAttribute("data-close")&&(t.tagName==="BUTTON"||e.target===t)){S.editing=null;S.gate=null;S.pin="";S.bad=false;return render()}
});
render();
if(CLOUD){
  cloudLoad(true);
  setInterval(function(){if(!S.editing&&!S.gate&&document.visibilityState!=="hidden")cloudLoad(true)},10000);
  document.addEventListener("visibilitychange",function(){if(document.visibilityState==="visible")cloudLoad(true)});
}
document.addEventListener("input",function(e){
  var i=e.target.closest("input[data-num]");if(!i)return;
  var raw=i.value.replace(/[^0-9]/g,"").slice(0,2);
  if(raw!==i.value)i.value=raw;
  var n=raw===""?0:Math.max(0,Math.min(30,parseInt(raw,10)));
  if(raw!==""&&String(n)!==raw)i.value=String(n);
  S[i.getAttribute("data-num")==="A"?"dA":"dB"]=n;
});
document.addEventListener("focusin",function(e){
  var i=e.target.closest("input[data-num]");if(i)setTimeout(function(){i.select()},0);
});
</script>
